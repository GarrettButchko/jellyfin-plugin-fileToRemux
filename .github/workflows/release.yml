name: Release Plugin

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build plugin
        run: dotnet publish Jellyfin.Plugin.JellyboiFileUpload.csproj -c Release -o ./publish -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Zip plugin
        run: |
          cd publish
          zip -j ../Jellyfin.Plugin.JellyboiFileUpload_${{ steps.version.outputs.VERSION }}.zip Jellyfin.Plugin.JellyboiFileUpload.dll

      - name: Compute MD5 checksum
        id: checksum
        run: |
          MD5=$(md5sum Jellyfin.Plugin.JellyboiFileUpload_${{ steps.version.outputs.VERSION }}.zip | awk '{print $1}')
          echo "MD5=$MD5" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and upload zip
        uses: softprops/action-gh-release@v2
        with:
          files: Jellyfin.Plugin.JellyboiFileUpload_${{ steps.version.outputs.VERSION }}.zip
          generate_release_notes: true

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Update manifest.json
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          MD5: ${{ steps.checksum.outputs.MD5 }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SOURCE_URL="https://github.com/GarrettButchko/Jellyfin.Plugin.JellyboiFileUpload/releases/download/v${VERSION}/Jellyfin.Plugin.JellyboiFileUpload_${VERSION}.zip"

          # Jellyfin manifests require a 4-part version (e.g. 1.0.1.0). Only append
          # the trailing zero when the tag doesn't already have four components.
          MANIFEST_VERSION="$VERSION"
          if [ "$(echo "$MANIFEST_VERSION" | awk -F. '{print NF}')" -lt 4 ]; then
            MANIFEST_VERSION="${MANIFEST_VERSION}.0"
          fi
          export MANIFEST_VERSION

          # Use existing manifest from gh-pages if it exists, otherwise start fresh
          MANIFEST_SRC="gh-pages/manifest.json"
          if [ ! -f "$MANIFEST_SRC" ]; then
            MANIFEST_SRC="/dev/null"
          fi

          python3 - <<PYEOF
          import json, os, sys

          src = "$MANIFEST_SRC"
          data = None
          if src != "/dev/null" and os.path.exists(src):
              with open(src) as f:
                  data = json.load(f)

          if not data:
              data = [{
                  "category": "General",
                  "guid": "a8f4c281-9f93-4a0b-88a2-11c7d23a49e1",
                  "name": "Jellyboi File Upload",
                  "description": "Enables seamless direct streaming uploads and auto-organization from FileToRemux.",
                  "overview": "Direct high-speed remux streaming and auto-organization plugin for Jellyfin.",
                  "owner": "GarrettButchko",
                  "versions": []
              }]

          new_version = {
              "version": os.environ["MANIFEST_VERSION"],
              "targetAbi": "10.9.0.0",
              "sourceUrl": "$SOURCE_URL",
              "checksum": "$MD5",
              "changelog": "See release notes on GitHub.",
              "timestamp": "$TIMESTAMP"
          }

          # Prepend new version (most recent first)
          data[0]["versions"].insert(0, new_version)

          os.makedirs("gh-pages", exist_ok=True)
          with open("gh-pages/manifest.json", "w") as f:
              json.dump(data, f, indent=2)
          print("manifest.json updated successfully")
          PYEOF

      - name: Deploy manifest to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages
          keep_files: true
